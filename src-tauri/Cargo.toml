[package]
name = "gp-circle"
version = "0.2.5"
description = "股票小分队桌面与 Android 外壳"
authors = ["you"]
license = "MIT"
homepage = "https://stockteam.uasier.com"
edition = "2021"

[lib]
name = "gp_circle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
default = ["desktop"]
desktop = []
