name: release

on:
  workflow_dispatch:
    inputs:
      targets:
        description: desktop、android 或 all
        default: all
        type: choice
        options:
          - all
          - desktop
          - android
  push:
    tags:
      - "v*"

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: 确保 Release 存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="v${{ steps.meta.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --title "股票小分队 ${tag}" \
            --notes "$(printf '%s\n' \
              '在线网站：https://stockteam.uasier.com/app/' \
              '下载页：https://stockteam.uasier.com/' \
              '接口：https://stockteam.uasier.com/api/')"

  desktop:
    needs: prepare
    if: github.event_name == 'push' || inputs.targets != 'android'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 股票小分队 v__VERSION__
          releaseBody: |
            在线网站：https://stockteam.uasier.com/app/
            下载页：https://stockteam.uasier.com/
            接口：https://stockteam.uasier.com/api/
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: 上传可读文件名
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          set -eu
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="v${version}"
          case "$MATRIX_ARGS" in
            *aarch64-apple-darwin*)
              dest="StockTeam-${version}-mac-arm64.dmg"
              kind=dmg
              ;;
            *x86_64-apple-darwin*)
              dest="StockTeam-${version}-mac-intel.dmg"
              kind=dmg
              ;;
            *)
              dest="StockTeam-${version}-windows-x64-setup.exe"
              kind=exe
              ;;
          esac
          if [ "$kind" = dmg ]; then
            src="$(/usr/bin/find src-tauri/target -type f -name '*.dmg' | head -n 1)"
          else
            src="$(/usr/bin/find src-tauri/target -type f -path '*/nsis/*.exe' | head -n 1)"
          fi
          if [ -z "$src" ] || [ ! -f "$src" ]; then
            echo "未找到安装包"
            /usr/bin/find src-tauri/target -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) || true
            exit 1
          fi
          cp "$src" "$dest"
          gh release upload "$tag" "$dest" --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' > assets.txt
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            [ "$name" = "$dest" ] && continue
            case "$name" in
              StockTeam-*) continue ;;
            esac
            drop=0
            case "$MATRIX_ARGS" in
              *aarch64-apple-darwin*)
                case "$name" in *aarch64*) drop=1 ;; esac
                ;;
              *x86_64-apple-darwin*)
                case "$name" in
                  *_x64.dmg|*_x64.app.tar.gz) drop=1 ;;
                esac
                ;;
              *)
                case "$name" in
                  *setup.exe|*.msi) drop=1 ;;
                esac
                ;;
            esac
            if [ "$drop" = 1 ]; then
              gh release delete-asset "$tag" --yes -- "$name" || true
            fi
          done < assets.txt

  android:
    needs: prepare
    if: github.event_name == 'push' || inputs.targets != 'desktop'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK 和 NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$HOME/android-sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 构建 APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: npx tauri android build --apk

      - name: 上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="v${version}"
          apk="$(/usr/bin/find src-tauri/gen/android/app/build/outputs/apk -type f -name 'app-universal-release.apk' | head -n 1)"
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "未找到 universal apk"
            /usr/bin/find src-tauri/gen/android -type f -name '*.apk' || true
            exit 1
          fi
          dest="StockTeam-${version}-android.apk"
          cp "$apk" "$dest"
          gh release upload "$tag" "$dest" --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' > assets.txt
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            [ "$name" = "$dest" ] && continue
            case "$name" in
              *.apk) gh release delete-asset "$tag" --yes -- "$name" || true ;;
            esac
          done < assets.txt
